name: Windows x64 构建与验收
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 同一提交的编译器冷启动与自举运行编号
        type: string
        required: true
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      candidate_run:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: '1'
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: 准备 MSYS2 UCRT64 工具链
        shell: 'C:/msys64/usr/bin/bash.exe --login -eo pipefail {0}'
        run: |
          pacman --noconfirm -Sy --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang
          command -v gcc clang as ld
          gcc --version | head -n 1
          clang --version | head -n 1
      - name: 安装 Neovim 与 VS Code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nvimZip = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/neovim/neovim/releases/latest/download/nvim-win64.zip' -OutFile $nvimZip
          $nvimStage = Join-Path $env:RUNNER_TEMP 'nvim-stage'
          Expand-Archive -Path $nvimZip -DestinationPath $nvimStage -Force
          $nvimRoot = Get-ChildItem -Path $nvimStage -Directory | Select-Object -First 1
          $nvimDest = Join-Path $env:ProgramFiles 'Neovim'
          if (Test-Path $nvimDest) { Remove-Item -Recurse -Force $nvimDest }
          Move-Item -Path $nvimRoot.FullName -Destination $nvimDest
          & "$nvimDest\bin\nvim.exe" --version | Select-Object -First 1

          $codeSetup = Join-Path $env:RUNNER_TEMP 'vscode-setup.exe'
          Invoke-WebRequest -Uri 'https://code.visualstudio.com/sha/download?build=stable&os=win32-x64' -OutFile $codeSetup
          $proc = Start-Process -FilePath $codeSetup -ArgumentList '/VERYSILENT', '/NORESTART', '/MERGETASKS=!runcode' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "VS Code 安装失败，退出码 $($proc.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\Microsoft VS Code\Code.exe")) { throw '找不到已安装的 Code.exe' }
      - name: 核对候选运行的来源
        if: inputs.commit == ''
        shell: 'C:/msys64/usr/bin/bash.exe --login -eo pipefail {0}'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          python test/gate/ci_release.py check-run "$CANDIDATE_RUN" "$GITHUB_SHA" .github/workflows/compiler-bootstrap.yml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-candidate
          path: test/gate/tmp/ci-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: 执行目标原生验收和打包
        shell: 'C:/msys64/usr/bin/bash.exe --login -eo pipefail {0}'
        env:
          SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          YAK_CI_NVIM: ${{ vars.YAK_WINDOWS_NVIM }}
          YAK_CI_CODE: ${{ vars.YAK_WINDOWS_CODE }}
          YAK_CI_CASE_JOBS: ${{ vars.YAK_WINDOWS_CASE_JOBS }}
        run: bash test/gate/ci_platform.sh win-x64 "$SOURCE_COMMIT" "$CANDIDATE_RUN"
      - name: 上传已验收的分发包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-win-x64
          path: test/gate/tmp/ci-delivery/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - name: 封存原始回执
        if: "!cancelled()"
        shell: 'C:/msys64/usr/bin/bash.exe --login -eo pipefail {0}'
        run: |
          [[ -d test/gate/tmp ]] || exit 0
          cd test/gate/tmp
          shopt -s nullglob
          paths=(ci-platform-evidence/logs ci-platform-evidence/stress-*.json ci-candidate/platform-win-x64.* lsp-neovim.*/{run.json,launcher.log,workspace} lsp-vscode.*/{run.json,editor.json,launcher.log,trace.log} lsp-corpus.*/run.json)
          if [[ -d ci-platform-evidence/logs ]]; then
            tar -czf platform-originals.tar.gz -- "${paths[@]}"
          fi
      - name: 上传原生证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-win-x64
          path: test/gate/tmp/platform-originals.tar.gz
          compression-level: 0
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
