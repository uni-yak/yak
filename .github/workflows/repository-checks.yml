name: 仓库检查
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ inputs.commit && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.commit }}

jobs:
  all-pass:
    name: 仓库检查通过
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: 准备仓库检查使用的 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: 检查规格和生成物
        run: |
          python tools/audit_spec.py
          python tools/symgen/lex_tables.py --check
          python tools/error_codes.py --check
      - name: 运行契约和 CI 封存自测
        run: |
          python tools/test_contracts.py
          python -m unittest tools.test_error_codes tools.test_shell_contract
          python test/gate/t2_stage_fixpoint_gate.py
          python -m unittest discover -s test/gate -p test_t2_stage_fixpoint_gate.py
          python test/gate/test_ci_artifacts.py
          python tools/shell_contract.py --strict --json "$RUNNER_TEMP/shell-contract.json" --text "$RUNNER_TEMP/shell-contract.txt" --quiet
          bash test/gate/test_ci_linux_snapshot.sh
          bash test/gate/test_ci_runner_env.sh
