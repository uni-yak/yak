name: Linux x86-64 构建与验收
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 同一提交的编译器冷启动与自举运行编号
        type: string
        required: true
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      candidate_run:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: 安装交叉工具链、Wine、Xvfb、Neovim 与 VS Code
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine xvfb dbus-x11 neovim
          curl -fsSL 'https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64' -o /tmp/vscode.deb
          sudo apt-get install -y /tmp/vscode.deb
          rm -f /tmp/vscode.deb
          x86_64-w64-mingw32-gcc --version | head -n 1
          wine --version
          nvim --version | head -n 1
          test -x /usr/share/code/code
      - name: 核对候选运行的来源
        if: inputs.commit == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          python test/gate/ci_release.py check-run "$CANDIDATE_RUN" "$GITHUB_SHA" .github/workflows/compiler-bootstrap.yml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-candidate
          path: test/gate/tmp/ci-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: 执行目标原生验收和打包
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          YAK_CI_NVIM: ${{ vars.YAK_LINUX_NVIM }}
          YAK_CI_CODE: ${{ vars.YAK_LINUX_CODE }}
          YAK_CI_WINE: ${{ vars.YAK_CI_WINE }}
          YAK_CI_CASE_JOBS: ${{ vars.YAK_LINUX_CASE_JOBS }}
          WINEPREFIX: ${{ runner.temp }}/yak-wine-platform
        run: |
          mkdir -p "$WINEPREFIX"
          WINEDEBUG=-all wineserver -p
          trap 'WINEDEBUG=-all wineserver -k >/dev/null 2>&1 || true' EXIT
          bash test/gate/ci_platform.sh linux-x64 "$SOURCE_COMMIT" "$CANDIDATE_RUN"
      - name: 上传已验收的分发包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-linux-x64
          path: test/gate/tmp/ci-delivery/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - name: 封存原始回执
        if: "!cancelled()"
        shell: bash
        run: |
          [[ -d test/gate/tmp ]] || exit 0
          cd test/gate/tmp
          shopt -s nullglob
          paths=(ci-platform-evidence/logs ci-platform-evidence/stress-*.json ci-candidate/platform-linux-x64.* lsp-neovim.*/{run.json,launcher.log,workspace} lsp-vscode.*/{run.json,editor.json,launcher.log,trace.log} lsp-corpus.*/run.json)
          paths+=(linux-runtime.* sysv-syscall.* base-linux-build.* lsp-linux-build.*)
          if [[ -d ci-platform-evidence/logs ]]; then
            tar -czf platform-originals.tar.gz -- "${paths[@]}"
          fi
      - name: 上传原生证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-linux-x64
          path: test/gate/tmp/platform-originals.tar.gz
          compression-level: 0
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
