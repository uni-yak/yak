name: 编译器冷启动与自举
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: 安装 MinGW 交叉工具链与 Wine
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine
          x86_64-w64-mingw32-gcc --version | head -n 1
          x86_64-w64-mingw32-ld --version | head -n 1
          wine --version
      - name: 执行冷启动门禁和自举
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
          GH_TOKEN: ${{ github.token }}
          SEED_URL: ${{ vars.YAK_SEED_URL }}
          YAK_CI_WINE: ${{ vars.YAK_CI_WINE }}
          WINEPREFIX: ${{ runner.temp }}/yak-wine-bootstrap
        run: |
          mkdir -p "$WINEPREFIX"
          # 保持常驻 wineserver，消除 3 秒空闲回收与短进程重连之间的 recvmsg 竞态。
          WINEDEBUG=-all wineserver -p
          trap 'WINEDEBUG=-all wineserver -k >/dev/null 2>&1 || true' EXIT
          bash test/gate/ci_bootstrap.sh "$SOURCE_COMMIT" "$GITHUB_RUN_ID"
      - name: 上传共享候选
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-candidate
          path: test/gate/tmp/ci-candidate/
          if-no-files-found: error
          overwrite: true
      - name: 归档自举的原始产物
        if: "!cancelled()"
        shell: bash
        run: |
          work=.cold-start/test/gate/tmp/ci-bootstrap-candidate
          if [[ -d "$work" ]]; then
            tar -czf test/gate/tmp/ci-bootstrap-evidence/selfhost-originals.tar.gz -C "$work" .
          fi
      - name: 上传冷启动和自举回执
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-bootstrap-evidence
          path: test/gate/tmp/ci-bootstrap-evidence/
          compression-level: 0
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
